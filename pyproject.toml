[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "spot-gazebo"
version = "0.1.0"
description = "Gazebo Harmonic simulation of the Spot URDF with a Boston Dynamics SDK adapter"
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
sdk = ["bosdyn-client==5.2.0"]

[tool.setuptools.packages.find]
include = ["spot_gazebo*"]
